spring:
  application:
    name: huddle-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/huddle
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456789}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-real-secret-before-any-deploy}
    expiration-ms: 86400000

  allowed-email-domains: cityengineeringcollege.ac.in

  cors:
    allowed-origins:
      - http://localhost:3000