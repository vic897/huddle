spring:
  application:
    name: huddle-backend

  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/huddle}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456789}

  flyway:
    enabled: false          # dev uses ddl-auto: update + schema.sql; Flyway is prod-only

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-real-secret-before-any-deploy}
    expiration-ms: 86400000

  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  email:
    dev-mode: ${EMAIL_DEV_MODE:true}

  allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:cityengineeringcollege.ac.in}

  google:
    client-id: ${GOOGLE_CLIENT_ID:73151215086-a5k8cdrq1qipb0duqbra4jdfurpjaepk.apps.googleusercontent.com}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Malware Scanner Configuration
scanner:
  clamav:
    enabled: ${SCANNER_CLAMAV_ENABLED:false}
    host: ${SCANNER_CLAMAV_HOST:localhost}
    port: ${SCANNER_CLAMAV_PORT:3310}
    timeout: ${SCANNER_CLAMAV_TIMEOUT:30}
    max-file-size: ${SCANNER_CLAMAV_MAX_FILE_SIZE:262144000}

# Safety Review Configuration
safety:
  review:
    overdue:
      threshold:
        hours: ${SAFETY_REVIEW_OVERDUE_THRESHOLD_HOURS:24}
    schedule:
      cron: ${SAFETY_REVIEW_SCHEDULE_CRON:0 0 0 * * ?}

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate          # Hibernate only validates; Flyway owns the schema

  flyway:
    enabled: true                 # Flyway active in prod; migrations in db/migration/

  sql:
    init:
      mode: never                 # schema.sql startup patches disabled in prod

logging:
  level:
    org.springframework.security: INFO

app:
  email:
    dev-mode: false
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
